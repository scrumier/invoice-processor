[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processor"
version = "0.1.0"
description = "Invoice PDF processor with LLM vision extraction"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "markupsafe>=3.0.0",
    "openai>=2.36.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "numpy>=2.4.4",
    "pytest>=9.0.3",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["processor*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes: undefined names, unused imports
    "I",      # isort: import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade: modernize syntax
    "B",      # flake8-bugbear: likely bugs, footguns
    "SIM",    # flake8-simplify
    "D",      # pydocstyle: docstring presence and format
    "ANN",    # flake8-annotations: missing type hints
    "TID",    # flake8-tidy-imports: ban relative imports
    "PL",     # Pylint subset (too-many-args, etc.)
    "RUF",    # Ruff-native rules
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation, and a test asserts on literals by design.
"tests/**" = ["D100", "D103", "ANN", "PLR2004"]
# Demo-data generator: long literal invoice layouts, not library code.
"generate_sample_invoices.py" = ["D103", "E501", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["processor"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
