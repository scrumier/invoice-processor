[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processor"
version = "0.1.0"
description = "Invoice PDF processor with LLM vision extraction"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "fpdf2>=2.8.7",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["processor*"]
